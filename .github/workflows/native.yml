name: Native

# Builds the native Flecs library (Native/Core + Native/App) and runs the Python native smokes,
# the contract checks (header, C# imports, every .flecs file) and the engine benchmark.
# No Unity involved; Unity suites still run locally (Tests/Run-All.cmd, Run-Extended.cmd).
on:
  push:
    branches: [main]
    paths:
      - 'Native/**'
      - 'Verification/*.py'
      - 'Verification/budgets/**'
      - 'Assets/**/*.flecs'
      - 'Packages/**/*.flecs'
      - 'Packages/com.runtime.flecs'
      - 'Packages/com.runtime.capabilities/**/*.cs'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'Native/**'
      - 'Verification/*.py'
      - 'Verification/budgets/**'
      - 'Assets/**/*.flecs'
      - 'Packages/**/*.flecs'
      - 'Packages/com.runtime.flecs'
      - 'Packages/com.runtime.capabilities/**/*.cs'
      - '.github/workflows/native.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Keep upstream line endings in vendor submodules
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false
      - name: Native submodules only, incl. their vendor forks (Store/ is private)
        run: git submodule update --init --recursive --depth 1 Native/Core Native/App
      - name: Bridge package (its DllImport declarations are checked against the native header)
        run: git submodule update --init --depth 1 Packages/com.runtime.flecs
      - name: Cache the sound bank (LFS)
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-soundbank-${{ hashFiles('.gitattributes') }}
      - name: Fetch only the LFS sound bank the audio smoke needs
        run: git lfs pull --include "Assets/StreamingAssets/Audio/GeneralUser-GS.sf2"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build flecs_unity.dll
        shell: pwsh
        run: ./Native/Build.ps1
      - name: Native smokes
        shell: pwsh
        run: |
          $failed = @()
          $smokes = @(
            @{ script = 'Verification/native_smoke.py'; args = @(); report = 'Verification/native-checks.json' },
            @{ script = 'Verification/capability_native_smoke.py'; args = @('Assets/Plugins/Flecs/x86_64/flecs_unity.dll'); report = 'Verification/capability-native-checks.json' },
            @{ script = 'Verification/runtime_engine_smoke.py'; args = @(); report = 'Verification/runtime-engine-native-checks.json' },
            @{ script = 'Verification/runtime_behavior_smoke.py'; args = @(); report = 'Verification/runtime-behavior-native-checks.json' },
            @{ script = 'Verification/workshop_chain_smoke.py'; args = @(); report = '' },
            @{ script = 'Verification/contract_checks.py'; args = @(); report = 'Verification/contract-checks.json' }
          )
          foreach ($smoke in $smokes) {
            Write-Host "::group::$($smoke.script)"
            python $smoke.script @($smoke.args)
            $ok = $LASTEXITCODE -eq 0
            if ($ok -and $smoke.report) { $ok = (Get-Content $smoke.report -Raw | ConvertFrom-Json).passed -eq $true }
            if (-not $ok) { $failed += $smoke.script }
            Write-Host '::endgroup::'
          }
          if ($failed.Count -gt 0) { throw "Failed: $($failed -join ', ')" }
      # The guards in Verification/budgets were measured on the development machine. Until they are confirmed on
      # this runner the benchmark reports without failing the job; it is enforced locally (Tests/Run-Extended.cmd).
      - name: Engine benchmark (report only)
        continue-on-error: true
        run: python Verification/bench_engine.py
      - name: Keep the benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-bench
          path: Verification/engine-bench.json
          if-no-files-found: ignore
