    #ecaty-crystal-gallery .cg-status { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
    #ecaty-crystal-gallery .cg-help { color:var(--cg-muted); font-size:12px; }
    #ecaty-crystal-gallery .cg-error { position:absolute; inset:25%; }

    #ecaty-crystal-gallery dialog h3 { font-size:15px; font-weight:500; margin:0 0 18px; }
    #ecaty-crystal-gallery dialog label { display:flex; justify-content:space-between; margin-bottom:12px; }
    #ecaty-crystal-gallery dialog input { width:100%; margin-bottom:14px; }
  </style>
